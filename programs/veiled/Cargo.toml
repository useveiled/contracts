[package]
name = "veiled"
version = "0.1.0"
description = "Solana program behind Veiled: .veiled handles, policy-bound AI agent vaults, pay requests with hidden amounts, disclosure receipts and $VEILED staking discounts"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "veiled"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.0", features = ["init-if-needed"] }
anchor-spl = "0.31.0"
